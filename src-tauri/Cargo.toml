[package]
name = "flowio"
version = "0.2.1"
edition = "2021"
description = "录步 Flowio - 桌面端录步应用"

# 自动化能力构建开关（cherry 自 develop a54a378，版本号保持 stable 0.2.x 不动）：
# - master（stable 线）默认 [] = 非自动化：普通 cargo build 即不含重放/审计/AI 兜底，
#   前端自动化入口随 VITE_AUTOMATION 隐藏——忘加参数也安全
# - develop（自动化线）default = ["automation"]：普通构建即全功能自动化版
[features]
default = []
automation = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "custom-protocol", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = "0.24"
ab_glyph = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "http2", "multipart"] }
regex = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
docx-rs = "0.4"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
xcap = "0.3"
scopeguard = "1.1"
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Accessibility",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_Xps",
    "Media_Ocr",
    "Storage_Streams",
] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
url = "2"
cpal = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
qrcode = { version = "0.14", default-features = false }

[patch.crates-io]
rfd = { path = "../patches/rfd" }

# 🔴 r1030：真机网络验证用的集成测试依赖（tests/live_ai_r1030.rs）。
#   集成测试是**独立 crate**，不会继承 [dependencies] ⇒ 必须显式声明。
[dev-dependencies]
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "http2"] }
base64 = "0.22"
